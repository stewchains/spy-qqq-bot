# =====================================================================
#  SPY / QQQ 30-45 DAY IRON CONDOR BOT — settings
#  Start with:  python run_bot.py --config config_swing.yaml   (or double-click start_bot_swing.bat)
#  Edit this file to change how the bot behaves. Restart the bot after edits.
# =====================================================================

bot_name: swing           # keeps its own state_swing.json, trades_swing.csv and logs/bot-swing-*.log
lock_port: 47824          # lets this bot run alongside the 0DTE bot

mode:
  paper: true              # true = Alpaca paper account (fake money). Keep true until the backtest + paper results look good.
  trade_options: true      # buy calls/puts on signals
  trade_shares: false      # day trade SPY/QQQ shares on signals. Turn on only if backtest.py shows an edge.
  dry_run: false           # true = analyze and log signals but never send any order (even paper)

symbols: [SPY, QQQ]        # SPY tracks the S&P 500, QQQ tracks the Nasdaq-100

data:
  stock_feed: iex          # "iex" is free. "sip" needs Alpaca's paid data plan (more accurate volume).
  options_feed: indicative # "indicative" is free (delayed-ish quotes). "opra" needs the paid plan.
  bar_minutes: 5           # intraday candle size used for signals

schedule:                  # all times are US/Eastern (market time). Oklahoma is 1 hour behind.
  no_entries_before: "09:45"   # skip the chaotic first 15 minutes
  no_entries_after: "15:00"   # can open a new condor any time 9:45 AM - 3:00 PM ET
  flatten_options_at: "15:40"  # close every bot option position before the close
  flatten_shares_at: "15:50"   # close every bot share position (day trades never held overnight)
  loop_seconds: 60             # how often the bot checks everything
  exit_after_close: true       # bot closes itself after the market closes, so a new copy starts clean each morning

strategy:
  type: iron_condor        # "iron_condor" = same-day (0DTE) iron condors (see condor: below)
                           # "directional" = the old call/put momentum strategy (settings below)
  min_score: 4             # signal strength needed to enter (max possible = 7). 4 = ~1-2 trades/day; 6 = ~1/week
  rsi_long_range: [50, 70] # long only when RSI is in this band (not already overbought)
  rsi_short_range: [30, 50]
  min_adx: 18              # trend strength filter; below this the market is chopping
  allow_shorts: true       # false = only take long trades (calls / buying shares)
  require_daily_trend: true  # only take longs in a daily uptrend and puts in a daily downtrend (neutral allows both)
  atr_stop_mult: 3.0       # underlying stop = entry -/+ 3 x ATR (wide, so noise doesn't stop you out)
  reward_risk: 1.0         # underlying target = 1x the stop distance

condor:                    # 30-45 day iron condors (tastytrade method + Cboe CNDR index) — see README
  mode: swing              # hold for days/weeks; NOT closed at the end of each day
  target_dte: 45           # open the expiration closest to 45 days out...
  min_dte: 30              # ...within 30-45 days
  max_dte: 45
  chain_pct: 0.15          # look at strikes within +/-15% of the price
  short_delta: 0.16        # sell ~16-delta put and call (~1 standard deviation; tastytrade standard)
  short_delta_range: [0.12, 0.20]
  wing_width: 5.0          # $5 wings on SPY/QQQ (~50 SPX points)
  min_credit_pct: 0.20     # skip unless credit >= 20% of wing width ($1.00 on $5 wings)
  max_leg_spread: 0.15     # short strikes: bid/ask spread must be under $0.15...
  max_leg_spread_pct: 0.20 # ...or under 20% of the option's price, whichever is looser
  take_profit_pct: 0.50    # buy back once 50% of the credit is kept (tastytrade)
  stop_loss_mult: 1.0      # buy back if the loss reaches 1x the credit (cost to close = 2x credit)
  close_at_dte: 21         # close at 21 days to expiration no matter what (tastytrade)
  breach_buffer_pct: null  # no "touched the short strike" exit for longer-dated condors
  time_exit: null          # no daily close-out
  max_per_symbol_per_day: 1  # and only 1 open condor per symbol at a time
  max_contracts: 10
  limit_retries: 3
  ta:                      # technical filter on DAILY candles: only open when the market is range-bound
    anchor: ema21          # measure distance from the 21-day EMA
    max_adx: 25            # weak trend on the daily chart
    rsi_range: [40, 60]    # daily momentum near neutral
    max_vwap_dist_atr: 1.5 # price within 1.5 daily ATRs of the 21-day EMA
    max_bb_expansion: 1.3  # daily Bollinger width not expanding

options:
  min_dte: 1               # days to expiration. 0 = same-day expiry (very high risk). Default avoids 0DTE.
  max_dte: 7
  target_delta: 0.45       # ~0.45 = slightly out of the money, moves close to half as much as the stock
  delta_range: [0.35, 0.60]
  max_spread_pct: 0.06     # skip contracts whose bid/ask spread is wider than 6% of the mid price
  min_open_interest: 500
  take_profit_pct: 0.60    # sell at +60%
  stop_loss_pct: 0.35      # sell at -35%
  trail_after_pct: 0.30    # once up 30%, start trailing...
  trail_giveback_pct: 0.20 # ...and exit if it falls 20% from its best price
  max_hold_minutes: 120    # time stop: exit if nothing happened in 2 hours
  limit_retries: 3         # how many times to re-price an unfilled limit order toward the ask

shares:
  use_bracket_orders: true # stop + target attached at the broker, so they work even if the bot crashes

risk:
  risk_per_trade_pct: 0.01     # max loss per trade = 1% of account
  max_position_pct: 0.05       # never put more than 5% of the account into one options trade
  max_share_position_pct: 0.50 # shares: max 50% of account in one position
  daily_max_loss_pct: 0.02     # stop trading for the day after losing 2%
  max_trades_per_day: 4
  max_open_positions: 2
  cooldown_after_loss_min: 20

news:
  enabled: false           # false = trade on technical analysis only (no news pauses or news-mood blocking)
  poll_seconds: 120
  lookback_minutes: 90     # headlines considered "current"
  block_score: -0.5        # sentiment below this blocks new longs (and above +0.5 blocks new puts/shorts)
  shock_pause_minutes: 15  # pause new entries after a high-impact headline (Fed, CPI, war, tariffs, halts...)
  use_claude: false        # true = send headlines to Claude for a smarter read (needs ANTHROPIC_API_KEY in .env)
  claude_model: claude-sonnet-4-5

events:
  enabled: false           # false = ignore the CPI/jobs/Fed calendar (no blackout windows)
  file: events.yaml        # scheduled market-moving releases (CPI, jobs, Fed). No entries around them.
  minutes_before: 15
  minutes_after: 30
